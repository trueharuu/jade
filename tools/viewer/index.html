<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OQB tree viewer</title>
  <style>
    :root {
      --bg: #1e1e1e;
      --card: #111111;
      --field: #222222;
      --line: #e5e9f0;
      --text: #d8d8d8;
      --muted: #888888;
      --red: #bf616a;
      --green: #a3be8c;
      --purple: #b48ead;
      --c: 14px;
      --T: rgb(255, 128, 255);
      --I: rgb(128, 255, 255);
      --J: rgb(128, 128, 255);
      --L: rgb(255, 191, 128);
      --O: rgb(255, 255, 128);
      --S: rgb(128, 255, 128);
      --Z: rgb(255, 128, 128);
      --X: rgb(128, 128, 128);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
      margin: 0;
    }

    body {
      display: flex;
      flex-direction: column;
      background: var(--bg);
      color: var(--text);
      font: 13px/1.35 system-ui, -apple-system, "Segoe UI", sans-serif;
      font-variant-numeric: tabular-nums;
    }

    header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px 14px;
      background: #272c36;
      border-bottom: 1px solid #3b4252;
      flex-wrap: wrap;
    }

    h1 {
      margin: 0;
      font-size: 14px;
      font-weight: 600;
    }

    #info {
      color: var(--muted);
      flex: 1;
      min-width: 120px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    button {
      font: inherit;
      color: var(--text);
      background: #3b4252;
      border: 1px solid #4c566a;
      border-radius: 4px;
      padding: 4px 10px;
      cursor: pointer;
    }

    button:hover {
      background: #4c566a;
    }

    button:focus-visible,
    input:focus-visible {
      outline: 2px solid #88c0d0;
      outline-offset: 2px;
    }

    label {
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--muted);
    }

    #vp {
      flex: 1;
      overflow: auto;
      cursor: grab;
      position: relative;
    }

    #vp.pan {
      cursor: grabbing;
      user-select: none;
    }

    .tree {
      width: max-content;
      min-width: 100%;
      padding: 24px;
      display: flex;
      justify-content: center;
    }

    .drop {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin: 40px;
      border: 2px dashed #4c566a;
      border-radius: 8px;
      color: var(--muted);
    }

    .drop[hidden],
    .ov[hidden] {
      display: none;
    }

    .drop p {
      margin: 0;
      font-size: 15px;
    }

    .ov {
      position: fixed;
      inset: 0;
      z-index: 9;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(46, 52, 64, .88);
      border: 3px dashed #88c0d0;
      font-size: 18px;
      pointer-events: none;
    }

    /* tree layout and connectors */
    .n {
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }

    .kids {
      display: flex;
      padding-top: 12px;
      position: relative;
    }

    .kids::before {
      content: "";
      position: absolute;
      top: 0;
      left: 50%;
      height: 12px;
      border-left: 1px solid var(--line);
    }

    .kids>.n {
      padding: 12px 5px 0;
    }

    .kids>.n::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      border-top: 1px solid var(--line);
    }

    .kids>.n::after {
      content: "";
      position: absolute;
      top: 0;
      left: 50%;
      height: 12px;
      border-left: 1px solid var(--line);
    }

    .kids>.n:first-child::before {
      left: 50%;
    }

    .kids>.n:last-child::before {
      right: 50%;
    }

    .kids>.n:only-child::before {
      display: none;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 3px;
      padding: 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      position: relative;
    }

    .br,
    .sv {
      cursor: pointer;
    }

    .sv:not(.open) figure:nth-child(n+2) {
      display: none;
    }

    .br:hover {
      border-color: #88c0d0;
    }

    .rv {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: calc(var(--c) * 1.2);
    }

    .sc {
      text-align: center;
      line-height: 1.2;
    }

    .sc b {
      display: block;
      font-size: 13px;
      font-weight: 600;
    }

    .sc small {
      color: var(--muted);
      font-size: 10px;
    }

    .pill {
      position: absolute;
      right: 3px;
      bottom: 3px;
      font-size: 10px;
      color: var(--muted);
    }

    .pill::before {
      content: "▸ ";
    }

    .open .pill::before {
      content: "▾ ";
    }

    .x {
      color: var(--red);
      font-size: calc(var(--c) * 2);
      line-height: 1;
      padding: 4px 10px;
      font-weight: 700;
    }

    .err {
      color: var(--red);
      font-size: 11px;
    }

    /* boards */
    .b {
      border-collapse: collapse;
      background: var(--field);
    }

    .b td {
      width: var(--c);
      height: var(--c);
      padding: 0;
      box-shadow: inset 0 0 0 0px rgba(255, 255, 255, .05);
    }

    .b.mini {
      background: none;
    }

    .b.mini td {
      width: calc(var(--c) * .6);
      height: calc(var(--c) * .6);
      box-shadow: none;
    }

    .b.mini td.e {
      background: none;
    }

    .T {
      background: var(--T);
    }

    .I {
      background: var(--I);
    }

    .J {
      background: var(--J);
    }

    .L {
      background: var(--L);
    }

    .O {
      background: var(--O);
    }

    .S {
      background: var(--S);
    }

    .Z {
      background: var(--Z);
    }

    .X {
      background: var(--X);
    }

    /* solve rows */
    .row {
      display: flex;
      gap: 6px;
      align-items: flex-start;
    }

    .row figure {
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
    }

    .row .b td {
      width: calc(var(--c) * .72);
      height: calc(var(--c) * .72);
    }

    figcaption {
      font-size: 10px;
      white-space: nowrap;
      color: var(--text);
    }

    figcaption.z {
      color: var(--muted);
    }

    figcaption.ts {
      color: var(--purple);
    }

    figcaption.pc {
      color: var(--green);
      font-weight: 600;
    }

    @media (prefers-reduced-motion: no-preference) {
      .card {
        transition: border-color .12s;
      }
    }
  </style>
</head>

<body>
  <header style="display:none;">
    <h1>OQB tree viewer</h1>
    <span id="info">No file open</span>
    <button id="pick">Open file</button>
    <button id="collapse">Collapse all</button>
    <button id="expand">Expand one level</button>
    <label>Zoom <input id="zoom" type="range" min="0.2" max="2" step="0.05" value="1"></label>
    <input id="fi" type="file" hidden>
  </header>
  <main id="vp">
    <div id="tree" class="tree"></div>
    <div id="empty" class="drop">
      <p>Drop a tree file here</p><button id="pick2" onclick="document.getElementById('fi').click()">Choose
        file</button>
    </div>
  </main>
  <div id="ov" class="ov" hidden>Drop to open</div>

  </script>
  <script>'use strict';
    const $ = id => document.getElementById(id);
    const vp = $('vp'), tree = $('tree'), info = $('info');
    const MIN_ROWS = 4, OPEN_DEPTH = 0, EXPAND_LIMIT = 3000;
    const fmt = n => Number(n).toFixed(2);
    const decode = TF.decoder.decode;

    // ---------- Parser ----------
    // Node: t=0 branch, 1 solve, 2 capped. f fumen, l leaves, c cost, e events, r reveal piece, k children.
    // Line kinds (after stripping leading tabs T):
    //   1 char                 -> reveal for the next node line
    //   2 fields (leaves,cost) -> capped; empty fumen adds one tab, so depth = T - 1
    //   3 fields               -> branch, depth = T
    //   4 fields               -> solve,  depth = T
    async function parse(file, onProgress) {
      const rd = file.stream().getReader(), dec = new TextDecoder();
      const stack = [];
      let root = null, pend = null, count = 0, buf = '', read = 0;
      const feed = line => {
        if (line.charCodeAt(line.length - 1) === 13) line = line.slice(0, -1);
        let t = 0;
        while (line.charCodeAt(t) === 9) t++;
        const rest = line.slice(t);
        if (!rest) return;
        if (rest.length === 1) { pend = rest; return; }
        const p = rest.split('\t');
        let n, d = t;
        if (p.length === 2) { n = { t: 2, l: +p[0], c: +p[1] }; d = t - 1; }
        else if (p.length === 3) n = { t: 0, f: p[0], l: +p[1], c: +p[2], k: [] };
        else n = { t: 1, f: p[0], l: +p[1], c: +p[2], e: p[3] };
        n.r = pend; pend = null; count++;
        if (d <= 0 || !stack[d - 1] || !stack[d - 1].k) { if (!root) root = n; d = 0; }
        else stack[d - 1].k.push(n);
        stack[d] = n; stack.length = d + 1;
      };
      for (; ;) {
        const { value, done } = await rd.read();
        if (done) break;
        read += value.length;
        buf += dec.decode(value, { stream: true });
        let s = 0, i;
        while ((i = buf.indexOf('\n', s)) >= 0) { feed(buf.slice(s, i)); s = i + 1; }
        buf = buf.slice(s);
        onProgress(read / file.size);
        await new Promise(r => setTimeout(r));
      }
      buf += dec.decode();
      if (buf) feed(buf);
      return { root, count };
    }

    // ---------- Board rendering ----------
    const filled = p => {
      const f = p.field.copy();
      if (p.operation) f.fill(p.operation, true);
      return f;
    };
    const height = f => {
      for (let y = 22; y >= 0; y--)
        for (let x = 0; x < 10; x++) if (f.at(x, y) !== '_') return y + 1;
      return 0;
    };
    const boardHTML = (f, rows) => {
      let h = '<table class="b">';
      for (let y = rows - 1; y >= 0; y--) {
        h += '<tr>';
        for (let x = 0; x < 10; x++) {
          const c = f.at(x, y);
          h += c === '_' ? '<td></td>' : `<td class="${c}"></td>`;
        }
        h += '</tr>';
      }
      return h + '</table>';
    };
    const miniCache = {};
    const pieceHTML = ch => miniCache[ch] ??= (() => {
      let cells;
      try { cells = new TF.Mino(ch, 'spawn', 1, 1).positions(); } catch { return ch; }
      const xs = cells.map(c => c.x), ys = cells.map(c => c.y);
      const x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys);
      const set = new Set(cells.map(c => c.x + ',' + c.y));
      let h = `<table class="b mini" title="${ch}">`;
      for (let y = y1; y >= y0; y--) {
        h += '<tr>';
        for (let x = x0; x <= x1; x++) h += set.has(x + ',' + y) ? `<td class="${ch}"></td>` : '<td class="e"></td>';
        h += '</tr>';
      }
      return h + '</table>';
    })();

    // ---------- Cards ----------
    const evClass = e => e === '0' ? 'z' : '';
    function cardHTML(n) {
      const rv = n.r ? `<div class="rv">${pieceHTML(n.r)}</div>` : '';
      try {
        if (n.t === 2)
          return `${rv}<div class="x" title="${n.l} leaves, cost ${n.c}">✕</div>`;
        const pages = decode(n.f);
        if (n.t === 0) {
          const f = filled(pages[0]);
          const pill = n.k.length ? `<span class="pill">${n.k.length}</span>` : '';
          return `${rv}${boardHTML(f, Math.max(MIN_ROWS, height(f)))}` +
            `<div class="sc"><b>${fmt(n.l ? n.c / n.l : 0)}</b><small>${fmt(n.c)} / ${n.l}</small></div>${pill}`;
        }
        const fs = pages.map(filled);
        const rows = Math.max(MIN_ROWS, ...fs.map(height));
        // Events cover the whole path from the root. The last pages.length events match the pages.
        const ev = n.e ? n.e.split(', ') : [];
        const off = Math.max(0, ev.length - pages.length);
        const row = fs.map((f, i) => {
          const e = ev[off + i] ?? '';
          return `<figure>${boardHTML(f, rows)}<figcaption class="${evClass(e)}">${e}</figcaption></figure>`;
        }).join('');
        // Collapsed solve cards show only the first placement (CSS hides the rest).
        const pill = fs.length > 1 ? `<span class="pill">${fs.length - 1}</span>` : '';
        return `${rv}<div class="row">${row}</div><div class="sc"><b>${fmt(n.c)}</b><small>score</small></div>${pill}`;
      } catch (err) {
        return `${rv}<div class="err">Cannot decode fumen</div>`;
      }
    }

    function build(n, open) {
      const el = document.createElement('div');
      el.className = 'n';
      const card = document.createElement('div');
      card.className = 'card ' + ['br', 'sv', 'cap'][n.t];
      card.innerHTML = cardHTML(n);
      card._n = n;
      n.card = card;
      el.appendChild(card);
      n.el = el;
      if (open > 0) addKids(n, open);
      return el;
    }
    function addKids(n, open) {
      if (!n.k || !n.k.length || n.kids) return;
      const kids = document.createElement('div');
      kids.className = 'kids';
      for (const c of n.k) kids.appendChild(build(c, open - 1));
      n.el.appendChild(kids);
      n.kids = kids;
      n.card.classList.add('open');
    }
    function toggle(n) {
      if (n.t === 1) { n.card.classList.toggle('open'); return; }
      if (!n.k || !n.k.length) return;
      if (n.kids) { n.kids.remove(); n.kids = null; n.card.classList.remove('open'); }
      else addKids(n, 1);
    }
    function expandLevel(root) {
      const todo = [];
      (function walk(n) {
        if (!n.k) return;
        if (n.kids) n.k.forEach(walk); else if (n.k.length) todo.push(n);
      })(root);
      const total = todo.reduce((s, n) => s + n.k.length, 0);
      if (total > EXPAND_LIMIT && !confirm(`This adds ${total.toLocaleString()} cards. Continue?`)) return;
      todo.forEach(n => addKids(n, 1));
    }

    // ---------- App ----------
    let cur = null;
    async function open(file) {
      if (!file) return;
      $('empty').hidden = true;
      info.textContent = `Reading ${file.name}…`;
      try {
        const { root, count } = await parse(file, p => info.textContent = `Reading ${file.name}… ${Math.round(p * 100)}%`);
        if (!root) throw new Error('No tree found in file.');
        cur = root;
        tree.replaceChildren(build(root, OPEN_DEPTH));
        const avg = root.t === 0 ? ` · root average ${fmt(root.l ? root.c / root.l : 0)}` : '';
        info.textContent = `${file.name} · ${count.toLocaleString()} nodes${avg}`;
        vp.scrollLeft = (vp.scrollWidth - vp.clientWidth) / 2;
        vp.scrollTop = 0;
      } catch (e) {
        info.textContent = 'Error: ' + e.message;
        $('empty').hidden = !!cur;
      }
    }

    $('pick').onclick = () => $('fi').click();
    $('fi').onchange = e => { open(e.target.files[0]); e.target.value = ''; };
    $('collapse').onclick = () => { if (cur) tree.replaceChildren(build(cur, 0)); };
    $('expand').onclick = () => cur && expandLevel(cur);
    const zoom = $('zoom');
    const setZoom = z => { z = Math.min(2, Math.max(0.2, z)); tree.style.zoom = z; zoom.value = z; };
    zoom.oninput = () => setZoom(+zoom.value);
    vp.addEventListener('wheel', e => {
      if (!e.ctrlKey) return;
      e.preventDefault();
      setZoom(+zoom.value * (e.deltaY < 0 ? 1.1 : 1 / 1.1));
    }, { passive: false });
    addEventListener('keydown', e => {
      if (e.key === 'ArrowUp') { e.preventDefault(); setZoom(+zoom.value * 1.1); }
      else if (e.key === 'ArrowDown') { e.preventDefault(); setZoom(+zoom.value / 1.1); }
    });

    // Drag to pan. A drag must not toggle a card.
    let drag = null, moved = false;
    vp.addEventListener('pointerdown', e => {
      if (e.button === 0) drag = { x: e.clientX, y: e.clientY, l: vp.scrollLeft, t: vp.scrollTop, m: false };
    });
    addEventListener('pointermove', e => {
      if (!drag) return;
      const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
      if (!drag.m && Math.abs(dx) + Math.abs(dy) > 4) { drag.m = true; vp.classList.add('pan'); }
      if (drag.m) { vp.scrollLeft = drag.l - dx; vp.scrollTop = drag.t - dy; }
    });
    addEventListener('pointerup', () => {
      if (drag && drag.m) { moved = true; setTimeout(() => moved = false); }
      drag = null; vp.classList.remove('pan');
    });
    vp.addEventListener('click', e => {
      const card = e.target.closest('.card');
      if (card && !moved) toggle(card._n);
    });

    // Drag and drop
    let depth = 0;
    addEventListener('dragenter', e => { e.preventDefault(); depth++; $('ov').hidden = false; });
    addEventListener('dragover', e => e.preventDefault());
    addEventListener('dragleave', () => { if (--depth <= 0) { depth = 0; $('ov').hidden = true; } });
    addEventListener('drop', e => {
      e.preventDefault(); depth = 0; $('ov').hidden = true;
      open(e.dataTransfer.files[0]);
    });
  </script>
