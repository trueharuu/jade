[workspace]
resolver = "3"
members = [
    "crates/jade_cli",
    "crates/jade_core",
    "crates/jade_pattern",
    "crates/sandbox",
]

[workspace.lints.clippy]
pedantic = { level = "warn", priority = 1 }
perf = { level = "deny", priority = 1 }
style = { level = "warn", priority = 1 }
suspicious = { level = "warn", priority = 1 }
complexity = { level = "warn", priority = 1 }
missing_errors_doc = { level = "allow", priority = 2 }
missing_safety_doc = { level = "allow", priority = 2 }
missing_panics_doc = { level = "allow", priority = 2 }
cast_possible_truncation = { level = "allow", priority = 2 }
cast_precision_loss = { level = "allow", priority = 2 }
cast_possible_wrap = { level = "allow", priority = 2 }
cast_sign_loss = { level = "allow", priority = 2 }
too_many_lines = { level = "allow", priority = 2 }
too_many_arguments = { level = "allow", priority = 2 }
inline_always = { level = "allow", priority = 2 }
